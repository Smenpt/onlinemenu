<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Вход — Листва</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/admin.css">
  <script type="module" src="/js/login.js"></script>
</head>
<body class="login-page">
  <form class="login-card" id="login-form">
    <a class="brand" href="/"><span class="brand-mark">Л</span><span>ЛИСТВА<small>АДМИН-ПАНЕЛЬ</small></span></a>
    <h1>Вход для персонала</h1>
    <label for="password">Пароль</label>
    <input id="password" type="password" autocomplete="current-password" required autofocus>
    <button class="checkout" type="submit">Войти <span>→</span></button>
    <p class="login-message" id="login-message" role="alert"></p>
  </form>
</body>
</html>
